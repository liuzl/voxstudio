name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    env:
      LIVEKIT_VERSION: 1.13.5
      LIVEKIT_SOURCE_SHA256: 50633b65316b0b8c854fb4bee4ae4040839fcf5c149bccb9ae2097fb7526991c
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
            slug: macos-arm64
            executable: ./apps/cli/dist/vox
            archive: tar
          - platform: macOS x64
            runner: macos-15-intel
            slug: macos-x64
            executable: ./apps/cli/dist/vox
            archive: tar
          - platform: Linux x64
            runner: ubuntu-24.04
            slug: linux-x64
            executable: ./apps/cli/dist/vox
            archive: tar
          - platform: Windows x64
            runner: windows-2025
            slug: windows-x64
            executable: ./apps/cli/dist/vox.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.os == 'macOS'
        with:
          go-version: "1.26.0"
          cache: false
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("apps/cli/package.json").json()).version)')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match CLI version $package_version" >&2
            exit 1
          }
      - name: Install locked dependencies
        run: bun ci
      - name: Prepare embedded LiveKit Server (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            asset="livekit_${LIVEKIT_VERSION}_source.tar.gz"
            source="$RUNNER_TEMP/livekit-source"
            mkdir -p "$source" "$RUNNER_TEMP/livekit"
            curl -fsSL "https://github.com/livekit/livekit/archive/refs/tags/v${LIVEKIT_VERSION}.tar.gz" \
              -o "$RUNNER_TEMP/$asset"
            echo "$LIVEKIT_SOURCE_SHA256  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
            tar -xzf "$RUNNER_TEMP/$asset" -C "$source" --strip-components=1
            helper="$RUNNER_TEMP/livekit/livekit-server"
            (
              cd "$source"
              CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w" \
                -o "$helper" ./cmd/server
            )
          else
            asset="livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
            release="https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}"
            mkdir -p "$RUNNER_TEMP/livekit"
            curl -fsSL "$release/$asset" -o "$RUNNER_TEMP/$asset"
            expected="$(curl -fsSL "$release/checksums.txt" | awk -v asset="$asset" '$2 == asset { print $1 }')"
            test -n "$expected"
            echo "$expected  $RUNNER_TEMP/$asset" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/livekit"
            helper="$(find "$RUNNER_TEMP/livekit" -type f -name livekit-server -print -quit)"
            test -n "$helper"
            chmod +x "$helper"
          fi
          test "$("$helper" --version)" = "livekit-server version $LIVEKIT_VERSION"
          echo "VOXSTUDIO_EMBED_LIVEKIT_SERVER=$helper" >> "$GITHUB_ENV"
      - name: Prepare embedded LiveKit Server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "livekit_$env:LIVEKIT_VERSION`_windows_amd64.zip"
          $release = "https://github.com/livekit/livekit/releases/download/v$env:LIVEKIT_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP "livekit"
          Invoke-WebRequest "$release/$asset" -OutFile $archive
          $checksums = (Invoke-WebRequest "$release/checksums.txt").Content -split "`n"
          $entry = $checksums | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
          if (-not $entry) { throw "No checksum found for $asset" }
          $expected = ($entry.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "LiveKit checksum mismatch: $actual != $expected" }
          Expand-Archive $archive -DestinationPath $destination
          $helper = Get-ChildItem $destination -Recurse -Filter livekit-server.exe | Select-Object -First 1
          if (-not $helper) { throw "livekit-server.exe missing from $asset" }
          $reported = (& $helper.FullName --version).Trim()
          if ($reported -ne "livekit-server version $env:LIVEKIT_VERSION") {
            throw "Unexpected LiveKit version: $reported"
          }
          "VOXSTUDIO_EMBED_LIVEKIT_SERVER=$($helper.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Typecheck
        run: bun run typecheck
      - name: Test TypeScript
        run: bun run test:ts
      - name: Build native executable
        run: bun run build:cli
      - name: Smoke test executable
        shell: bash
        env:
          VOX: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          "$VOX" --help | grep -q "voxstudio: self-hosted voice I/O"
          "$VOX" say --help | grep -q "usage: vox say"
          "$VOX" voices --help | grep -q "usage: vox voices"
          set +e
          "$VOX" invalid-command >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 2
      - name: Package Unix executable
        if: matrix.archive == 'tar'
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          VOX: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="vox-${version}-${SLUG}"
          mkdir -p "dist-release/$package"
          cp "$VOX" README.md config.example.yaml "dist-release/$package/"
          chmod +x "dist-release/$package/vox"
          tar -C dist-release -czf "dist-release/$package.tar.gz" "$package"
          rm -rf "dist-release/$package"
      - name: Package Windows executable
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          SLUG: ${{ matrix.slug }}
          VOX: ${{ matrix.executable }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $package = "vox-$version-$env:SLUG"
          New-Item -ItemType Directory -Path "dist-release/$package" | Out-Null
          Copy-Item $env:VOX, README.md, config.example.yaml -Destination "dist-release/$package"
          Compress-Archive -Path "dist-release/$package" -DestinationPath "dist-release/$package.zip"
          Remove-Item -Recurse "dist-release/$package"
      - name: Record release sizes
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          VOX: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          archive="$(find dist-release -maxdepth 1 -type f \( -name 'vox-*.tar.gz' -o -name 'vox-*.zip' \) -print -quit)"
          test -n "$archive"
          helper_bytes="$(wc -c < "$VOXSTUDIO_EMBED_LIVEKIT_SERVER" | tr -d '[:space:]')"
          binary_bytes="$(wc -c < "$VOX" | tr -d '[:space:]')"
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          helper_mib="$(awk -v bytes="$helper_bytes" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
          binary_mib="$(awk -v bytes="$binary_bytes" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
          archive_mib="$(awk -v bytes="$archive_bytes" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
          {
            echo "### Release size — $SLUG"
            echo
            echo "| Artifact | Bytes | MiB |"
            echo "|---|---:|---:|"
            echo "| Embedded LiveKit helper | $helper_bytes | $helper_mib |"
            echo "| Compiled vox | $binary_bytes | $binary_mib |"
            echo "| $(basename "$archive") | $archive_bytes | $archive_mib |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.slug }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist-release
        run: sha256sum vox-* | sort -k2 > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist-release/*
          --verify-tag
          --generate-notes
          --title "VoxStudio CLI $GITHUB_REF_NAME"

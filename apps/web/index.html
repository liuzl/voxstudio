<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxStudio</title>
    <script>
      // Pre-paint theme: src/theme.ts owns it once the app boots; this only avoids a flash.
      var voxTheme = localStorage.getItem("voxstudio.theme");
      document.documentElement.dataset.theme =
        voxTheme === "light" || voxTheme === "dark"
          ? voxTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
